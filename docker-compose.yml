services:
  gateway:
    build: .
    container_name: llmgateway_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - gateway_data:/app
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: llmgateway_prometheus
    volumes:
      - ./docs/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - gateway

  grafana:
    image: grafana/grafana:latest
    container_name: llmgateway_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

volumes:
  gateway_data:
