<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%" style="background-color: white; font-family: sans-serif;">
  <defs>
    <!-- Solid arrow for synchronous messages -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333" />
    </marker>
    <!-- Red arrow for 402 response -->
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d9534f" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="25" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">llmgateway Request Flow Sequence</text>

  <!-- Lifelines -->
  <line x1="100" y1="80" x2="100" y2="760" stroke="#999" stroke-width="2" stroke-dasharray="5,5" />
  <line x1="250" y1="80" x2="250" y2="760" stroke="#999" stroke-width="2" stroke-dasharray="5,5" />
  <line x1="400" y1="80" x2="400" y2="760" stroke="#999" stroke-width="2" stroke-dasharray="5,5" />
  <line x1="550" y1="80" x2="550" y2="760" stroke="#999" stroke-width="2" stroke-dasharray="5,5" />
  <line x1="700" y1="80" x2="700" y2="760" stroke="#999" stroke-width="2" stroke-dasharray="5,5" />

  <!-- Actor Boxes -->
  <g fill="#E6F2FF" stroke="#0066CC" stroke-width="2">
    <rect x="50" y="40" width="100" height="40" rx="6"/>
    <rect x="200" y="40" width="100" height="40" rx="6"/>
    <rect x="350" y="40" width="100" height="40" rx="6"/>
    <rect x="500" y="40" width="100" height="40" rx="6"/>
    <rect x="650" y="40" width="100" height="40" rx="6"/>
  </g>

  <!-- Actor Text -->
  <g font-size="14" font-weight="bold" text-anchor="middle" fill="#333">
    <text x="100" y="65">Client</text>
    <text x="250" y="65">Gateway</text>
    <text x="400" y="65">Redis</text>
    <text x="550" y="65">FAISS</text>
    <text x="700" y="65">LiteLLM / Groq</text>
  </g>

  <!-- Messages -->
  <g font-size="13" fill="#333">
    <!-- Client to Gateway -->
    <line x1="100" y1="120" x2="245" y2="120" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="175" y="110" text-anchor="middle">POST /v1/chat</text>
    <text x="175" y="135" text-anchor="middle" font-size="11" fill="#666">t=0ms</text>

    <!-- Gateway to Redis (Rate Limit) -->
    <line x1="250" y1="160" x2="395" y2="160" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="325" y="150" text-anchor="middle">Check Token Bucket</text>
    <text x="325" y="175" text-anchor="middle" font-size="11" fill="#666">t=2ms</text>

    <!-- Redis to Gateway -->
    <line x1="400" y1="190" x2="255" y2="190" stroke="#333" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
    <text x="325" y="182" text-anchor="middle">Allowed</text>

    <!-- NEW: Gateway Self-Loop (Estimate Cost) -->
    <path d="M 250 215 C 290 215, 290 245, 255 245" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="285" y="225" text-anchor="start">Estimate Cost (chars/4 heuristic, resolve model price)</text>
    <text x="285" y="240" text-anchor="start" font-size="11" fill="#666">t=3ms (in-process)</text>

    <!-- NEW: Conditional Branch -->
    <text x="250" y="280" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">[Budget Guardrail Check]</text>
    
    <!-- Over budget path -->
    <text x="175" y="305" text-anchor="middle" font-size="12" font-style="italic" fill="#d9534f">If over budget:</text>
    <line x1="250" y1="330" x2="105" y2="330" stroke="#d9534f" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-red)"/>
    <text x="175" y="322" text-anchor="middle" fill="#d9534f" font-weight="bold">402 Payment Required</text>
    <text x="175" y="345" text-anchor="middle" font-size="11" fill="#d9534f">(failed_cap, cap_limit_usd, estimate)</text>
    <text x="175" y="360" text-anchor="middle" font-size="11" fill="#d9534f" font-style="italic">terminates here (Redis/FAISS/LiteLLM not called)</text>

    <!-- Within budget path -->
    <text x="325" y="360" text-anchor="middle" font-size="12" font-style="italic" fill="#5cb85c">If within budget:</text>

    <!-- Gateway to Redis (L1 Cache) -->
    <line x1="250" y1="380" x2="395" y2="380" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="325" y="370" text-anchor="middle">L1 Cache Get (Hash)</text>
    <text x="325" y="395" text-anchor="middle" font-size="11" fill="#666">t=5ms</text>

    <!-- Redis to Gateway -->
    <line x1="400" y1="410" x2="255" y2="410" stroke="#333" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
    <text x="325" y="402" text-anchor="middle">Miss</text>

    <!-- Gateway Self-Loop (Generate Vector) -->
    <path d="M 250 430 C 290 430, 290 460, 255 460" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="285" y="440" text-anchor="start">Generate Vector (fastembed BGE-small)</text>
    <text x="285" y="455" text-anchor="start" font-size="11" fill="#666">t=10ms</text>

    <!-- Gateway to FAISS (L2 Cache) -->
    <line x1="250" y1="490" x2="545" y2="490" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="400" y="480" text-anchor="middle">L2 FAISS Semantic Search</text>
    <text x="400" y="505" text-anchor="middle" font-size="11" fill="#666">t=20ms</text>

    <!-- FAISS to Gateway -->
    <line x1="550" y1="520" x2="255" y2="520" stroke="#333" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
    <text x="400" y="512" text-anchor="middle">Miss (Score &lt; 0.85)</text>

    <!-- Gateway to Upstream -->
    <line x1="250" y1="560" x2="695" y2="560" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="475" y="550" text-anchor="middle">Generate Completion</text>
    <text x="475" y="575" text-anchor="middle" font-size="11" fill="#666">t=25ms</text>

    <!-- Upstream to Gateway -->
    <line x1="700" y1="630" x2="255" y2="630" stroke="#333" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
    <text x="475" y="622" text-anchor="middle">Response</text>
    <text x="475" y="645" text-anchor="middle" font-size="11" fill="#666">t=850ms</text>

    <!-- Gateway to Redis/FAISS (Save) -->
    <line x1="250" y1="670" x2="395" y2="670" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="325" y="662" text-anchor="middle">Save L1 (Async Background Task)</text>
    <line x1="250" y1="695" x2="545" y2="695" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="400" y="687" text-anchor="middle">Save L2 (Async Background Task)</text>

    <!-- Gateway to Client -->
    <line x1="250" y1="735" x2="105" y2="735" stroke="#333" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
    <text x="175" y="727" text-anchor="middle">Return Response</text>
    <text x="175" y="750" text-anchor="middle" font-size="11" fill="#666">t=860ms</text>
  </g>
</svg>
